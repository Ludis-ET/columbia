name: Build and deploy to cPanel

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Never cancel an upload or activation halfway through.
concurrency:
  group: cpanel-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # Provider certificate identity. HOST still selects the actual FTP server.
  FTP_TLS_SERVER_NAME: ${{ vars.FTP_TLS_SERVER_NAME || 'vesper.hostns.io' }}
  RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  build:
    name: Build and verify release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # All required secrets already exist in the repository.
    # SMTP/Resend credentials stay in cPanel; the service-role key is unused.
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      # Public address: no NEXT_PUBLIC_SITE_URL secret is needed.
      NEXT_PUBLIC_SITE_URL: https://columbiacareafh.com
      # Optional; leave unset unless Turnstile is enabled.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check production configuration
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          HOST: ${{ secrets.HOST }}
          FTP: ${{ secrets.FTP }}
          PASS: ${{ secrets.PASS }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://columbiacareafh.com' }}
        run: |
          python scripts/deploy_cpanel.py --check-connection
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          for (const name of ['NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY']) {
            assert(process.env[name], 'Missing repository secret: ' + name);
          }
          const key = process.env.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY;
          if (key) assert(Buffer.from(key, 'base64').length === 32, 'Server Actions key must be base64-encoded 32 bytes');
          NODE

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit and deployment regression tests
        run: |
          pnpm test:unit
          pnpm test:deploy

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-next22-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next22-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build production application
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Package and compress standalone output once
        run: pnpm deploy:package

      - name: Verify archive extraction and HTTP through LiteSpeed require
        run: pnpm deploy:smoke

      - name: Save verified release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cpanel-release
          path: cpanel-release.tar.gz
          retention-days: 3
          if-no-files-found: error
          compression-level: 0

  deploy:
    name: Deploy and verify live site
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout deployment scripts
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the tested artifact
        uses: actions/download-artifact@v4
        with:
          name: cpanel-release

      - name: Read startup files from the tested archive
        run: |
          mkdir deploy-dist
          tar -xzf cpanel-release.tar.gz -C deploy-dist ./server.js ./cpanel.cjs ./active-release.json

      - name: Upload, activate, restart and verify (rollback on failure)
        env:
          HOST: ${{ secrets.HOST }}
          FTP: ${{ secrets.FTP }}
          PASS: ${{ secrets.PASS }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || '21' }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '.' }}
          SITE_URL: ${{ vars.SITE_URL || 'https://columbiacareafh.com' }}
        run: python scripts/deploy_cpanel.py

      - name: Record successful deployment
        run: |
          echo "Verified release: $RELEASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Health, homepage, JavaScript, CSS and admin login all passed." >> "$GITHUB_STEP_SUMMARY"
