name: Deploy to cPanel

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-cpanel
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create production env file
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cat << EOF > .env
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          EOF
          cp .env .env.production
          cp .env .env.local

      - name: Build Next.js application
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: pnpm build

      - name: Prepare deployment bundle
        run: |
          mkdir -p deploy-dist

          # Copy compiled production build (.next)
          cp -r .next deploy-dist/

          # Strip build-only caches, sourcemaps, and traces (cuts 80%+ of files for fast FTP)
          rm -rf deploy-dist/.next/cache
          rm -rf deploy-dist/.next/diagnostics
          rm -rf deploy-dist/.next/build
          find deploy-dist/.next -name "*.map" -type f -delete
          find deploy-dist/.next -name "*.nft.json" -type f -delete

          # Copy public assets
          if [ -d "public" ]; then
            cp -r public deploy-dist/
          fi

          # Copy package.json, server.js, and environment files for cPanel
          cp package.json deploy-dist/
          cp server.js deploy-dist/
          cp .env deploy-dist/.env
          cp .env.local deploy-dist/.env.local

          # Signal Phusion Passenger on cPanel to restart the application
          mkdir -p deploy-dist/tmp
          touch deploy-dist/tmp/restart.txt

      - name: Deploy via FTP to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOST }}
          username: ${{ secrets.FTP }}
          password: ${{ secrets.PASS }}
          local-dir: ./deploy-dist/
          server-dir: ./
          security: loose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.next/cache/**
            **/.next/diagnostics/**
            **/.next/build/**
            **/*.map
            **/*.nft.json
