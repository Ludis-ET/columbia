name: Supabase keep-alive

# Supabase free-tier projects pause after 7 days of inactivity. A paused project
# means a dead contact form and a dead admin login, the public site survives
# because it falls back to file content (see src/lib/db/queries.ts), but nothing
# a family submits would reach the owner.
#
# This runs a trivial read every three days to keep the project awake.
#
# It is the CHEAP mitigation. The proper fix is Supabase Pro at $25/mo, which is
# what to budget for a paying client, see the build plan, section 19.

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Read one row to keep the project awake
        env:
          URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "::error::Set NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY as repository secrets."
            exit 1
          fi

          status=$(curl -s -o /tmp/body -w '%{http_code}' \
            "$URL/rest/v1/site_settings?select=id&limit=1" \
            -H "apikey: $KEY")

          echo "HTTP $status"
          cat /tmp/body

          if [ "$status" != "200" ]; then
            echo "::error::Supabase did not respond 200, the project may be paused or the schema is missing."
            exit 1
          fi
